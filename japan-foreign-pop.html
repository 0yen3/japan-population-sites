<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>日本の将来人口・外国人比率予測</title>
<style id="app-css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07060d;--card:#110e1d;--line:#2a2145;--tx:#e9e6f5;--mut:#8f88ad;--jp:#6366f1;--fo:#f43f9e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#2b1459 0,transparent 60%),var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:clamp(20px,4.2vw,32px);margin:0 0 4px;background:linear-gradient(90deg,#c084fc,#f43f9e,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--mut);padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;transition:all .3s;font-family:inherit}
.tab.on{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;box-shadow:0 0 18px #9333ea88}
.grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1.05fr 1fr}}
.card{background:linear-gradient(180deg,#14102499,#0d0a18cc);border:1px solid var(--line);border-radius:18px;padding:14px;backdrop-filter:blur(6px)}
#map{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;width:100%;height:auto;max-height:78vh;display:block}
.land{vector-effect:non-scaling-stroke;fill:#1b1432;stroke:#8b5cf6;stroke-width:1;filter:drop-shadow(0 0 4px #8b5cf6aa)}
.pin{cursor:pointer;transition:opacity .35s}.zc{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:2;align-items:center}.zb{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#110e1de6;color:#e9e6f5;cursor:pointer;display:grid;place-items:center;transition:all .2s}.zb:hover{border-color:#a855f7;box-shadow:0 0 12px #9333ea88}
.pin .ring{transition:stroke-dasharray .5s ease,stroke .3s}
.pin .bg{fill:#0b0816;stroke:#2f2650;stroke-width:3;transition:all .3s}
.pin .halo{fill:none;stroke:#22d3ee;stroke-width:1.5;opacity:0;transition:opacity .3s}
.pin.on .halo{opacity:1;animation:pulse 1.6s infinite}
.pin.on .bg{stroke:#3b2d70}
.pin text{fill:#e9e6f5;font-size:7px;text-anchor:middle;pointer-events:none}
.pin .nm{font-size:8px;fill:#b9b0dc}
@keyframes pulse{0%{r:14;opacity:.9}100%{r:22;opacity:0}}
.lead{stroke:#6d5bb0;stroke-width:.7;stroke-dasharray:2 2}
.dot{fill:#22d3ee}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{font-size:clamp(30px,6vw,44px);font-weight:800;line-height:1}
.lbl{font-size:11px;color:var(--mut)}
.donutbox{position:relative;width:170px;height:170px;flex:none}
.donutbox svg{transform:rotate(-90deg)}
.donutbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.circ{fill:none;stroke-width:14;transition:stroke-dasharray .5s ease}
.stat{background:#0d0a18;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1;min-width:120px}
.stat b{display:block;font-size:20px;margin-top:2px}
input[type=range]{width:100%;accent-color:#c026d3;height:28px}
.play{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 0 16px #c026d388}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:#0d0a18;color:var(--mut);border-radius:999px;font-size:12px;padding:5px 10px;cursor:pointer;transition:all .3s;font-family:inherit}
.chip.on{color:#fff;border-color:#a855f7;background:#3b0f6b}
.dp{cursor:pointer}.dp .d{fill:#8b5cf6;transition:all .3s}.dp .hit{fill:transparent}.dp .sel{fill:none;stroke:#22d3ee;stroke-width:1.5;opacity:0;transition:opacity .3s}
.dp.on .sel{opacity:1}.dp.on .d{fill:#22d3ee}.dp text{fill:#e9e6f5;font-size:8px;text-anchor:middle;opacity:0;pointer-events:none;paint-order:stroke;stroke:#07060d;stroke-width:2.5px;transition:opacity .3s}.dp.on text{opacity:1}
.chips{max-height:170px;overflow-y:auto}
.legend{display:flex;gap:12px;font-size:12px;margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.note{font-size:11px;color:var(--mut);line-height:1.7;margin-top:14px}
.fade{animation:fd .5s ease}
@keyframes fd{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.path{fill:none;stroke-width:2;transition:d .5s}
.sec{margin-top:40px}
.sec h2{font-size:clamp(18px,3.6vw,26px);margin:0 0 6px;background:linear-gradient(90deg,#c084fc,#f43f9e,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.sec .intro{color:var(--mut);font-size:13px;line-height:1.8;max-width:820px}
.th{margin-top:16px;border-color:color-mix(in srgb,var(--ac) 45%,var(--line));box-shadow:0 0 24px color-mix(in srgb,var(--ac) 14%,transparent)}
.th .hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.th .no{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--ac);box-shadow:0 0 16px var(--ac);flex:none}
.th h3{margin:0;font-size:clamp(15px,3vw,19px)}
.th .hd .lbl{margin-top:2px}
.cases{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.case{background:#0d0a18;border:1px solid var(--line);border-radius:12px;padding:12px;transition:border-color .3s,transform .3s}
.case:hover{border-color:var(--ac);transform:translateY(-2px)}
.tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:999px;color:var(--ac);border:1px solid var(--ac);margin-bottom:6px;font-weight:700}
.case ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.75;color:#cfc9e6}
.case li{margin-bottom:3px}
.lesson{margin-top:12px;border:1px dashed var(--ac);border-radius:12px;padding:10px 14px;background:#ffffff06;font-size:13px;line-height:1.8}
.lesson b{color:var(--ac)}
.cave{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.7}
.checks{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.checks div{background:#0d0a18;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.7}
.checks b{display:block;color:#c084fc;margin-bottom:2px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}.tl div{position:relative;margin-bottom:10px;font-size:12.5px;line-height:1.7;color:#cfc9e6}.tl div::before{content:'';position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}.tl b{color:var(--c);margin-right:8px;font-size:12px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

#admBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;border-radius:999px;border:1px solid #a855f7;background:#1a1030;color:#fff;padding:10px 16px;cursor:pointer;box-shadow:0 0 16px #9333ea88;font-family:inherit;font-size:13px}
#admBtn[hidden],#adm[hidden]{display:none}
#adm{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);z-index:60;background:#0b0816f5;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
.ah{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.am{padding:6px 12px;font-size:11.5px;color:#c4b5fd;border-bottom:1px solid var(--line)}
.at{display:flex;gap:4px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.at button{border:1px solid var(--line);background:#0d0a18;color:var(--mut);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.at button.on{background:#3b0f6b;color:#fff;border-color:#a855f7}
.ab{overflow:auto;padding:10px 12px 40px;flex:1}
.f{display:block;margin:8px 0}.f>span{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
.f input[type=text],.f input[type=number],.f textarea,.js{width:100%;background:#0d0a18;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
.f input[type=color]{width:60px;height:30px;border:1px solid var(--line);background:none;border-radius:6px}
.js{height:55vh;font-family:ui-monospace,Menlo,monospace;font-size:12px}
details.d{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 10px;background:#ffffff05}
details.d>summary{cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ct{display:inline-flex;gap:3px}.ct button{border:1px solid var(--line);background:#0d0a18;color:var(--mut);border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer}
.ar{display:flex;gap:6px;align-items:flex-start}.ar .f{flex:1}
.btn{border:1px solid var(--line);background:#0d0a18;color:var(--tx);border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;margin:4px 4px 0 0}
.btn.pri{background:linear-gradient(135deg,#7c3aed,#c026d3);border-color:#a855f7}
.bar{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
</style>
</head>

<div class="wrap" id="wrap">
  <h1 id="t_title"></h1>
  <div class="sub" id="t_sub"></div>
  <div class="tabs" id="viewTabs">
    <button class="tab on" data-v="nat" id="t_tabNat"></button>
    <button class="tab" data-v="pref" id="t_tabPref"></button>
  </div>

  <div class="grid">
    <div class="card" style="position:relative">
      <div class="zc">
        <button class="zb" id="zin" aria-label="拡大"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="zb" id="zout" aria-label="縮小"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="zb" id="zrst" aria-label="全体表示"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        <span class="lbl" id="zl">100%</span>
      </div>
      <svg id="map" viewBox="0 0 380 440" role="img" aria-label="日本地図"></svg>
      <div class="lbl" id="t_mapCap" style="text-align:center"></div>
    </div>

    <div class="card">
      <div class="tabs" id="scTabs" style="margin-bottom:12px"></div>
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <div><div class="lbl" id="areaLbl"></div><div class="big" id="yearBig">2025</div></div>
        <div class="lbl" id="scDesc" style="max-width:52%;text-align:right"></div>
      </div>
      <div class="row" style="margin:10px 0 4px">
        <button class="play" id="play" aria-label="再生"></button>
        <input type="range" id="slider" min="2025" max="2070" step="1" value="2025">
      </div>
      <div class="row" style="justify-content:space-between" class="lbl"><span class="lbl" id="t_y0"></span><span class="lbl" id="t_y1"></span></div>

      <div class="row" style="margin-top:12px;gap:18px;justify-content:center">
        <div class="donutbox">
          <svg viewBox="0 0 140 140" width="170" height="170">
            <circle class="circ" cx="70" cy="70" r="52" stroke="#1d1836"/>
            <circle class="circ" id="dJp" cx="70" cy="70" r="52" stroke="var(--jp)" stroke-dasharray="327 327"/>
            <circle class="circ" id="dFo" cx="70" cy="70" r="52" stroke="var(--fo)" stroke-dasharray="0 327" style="filter:drop-shadow(0 0 5px #f43f9e)"/>
          </svg>
          <div class="c"><div class="lbl" id="t_ratioLbl"></div><div class="big" id="ratioBig" style="font-size:30px">0%</div></div>
        </div>
        <div style="flex:1;min-width:160px">
          <div class="legend"><span><i style="background:var(--jp)"></i><em id="t_jpLeg" style="font-style:normal"></em></span><span><i style="background:var(--fo)"></i><em id="t_foLeg" style="font-style:normal"></em></span></div>
          <div class="stat"><span class="lbl" id="t_totLbl"></span><b id="tot">-</b></div>
          <div class="row" style="margin-top:8px">
            <div class="stat"><span class="lbl" id="t_jpLbl" style="color:#a5b4fc"></span><b id="jp">-</b><span class="lbl" id="jpP"></span></div>
            <div class="stat"><span class="lbl" id="t_foLbl" style="color:#f9a8d4"></span><b id="fo">-</b><span class="lbl" id="foP"></span></div>
          </div>
        </div>
      </div>

      <div style="margin-top:14px">
        <div class="lbl" id="t_chartTitle" style="margin-bottom:2px"></div>
        <svg id="chart" viewBox="0 0 320 120" style="width:100%"></svg>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="note" id="t_note"></div>
  <section class="sec" id="lessons"></section>
</div>


<button id="admBtn" hidden>⚙ 管理</button>
<div id="adm" hidden>
  <div class="ah">
    <b style="font-size:14px">管理パネル</b>
    <span style="flex:1"></span>
    <button class="btn pri" id="adPub" type="button">公開して全員に反映</button>
    <button class="btn" id="adRev" type="button">元に戻す</button>
    <button class="btn" id="adClose" type="button">閉じる</button>
  </div>
  <div class="am" id="adMsg">文章・数値を編集すると、この画面にすぐ反映されます。「公開」で全員の画面に反映されます。</div>
  <div class="at" id="adTabs">
    <button data-k="site" class="on">画面の文言</button><button data-k="model">設定</button><button data-k="scenarios">シナリオ</button><button data-k="prefectures">都道府県</button><button data-k="lessons">事例</button><button data-k="json">JSON</button>
  </div>
  <div class="ab" id="adBody"></div>
</div>

    mk('polyline',{points:ys.map((y,i)=>X(y)+','+Y(data[k.id][i])).join(' '),fill:'none',stroke:k.color,'stroke-width':k.id===S.sc?2.5:1.2,opacity:k.id===S.sc?1:.45},el);
  });
  mk('line',{x1:X(S.year),x2:X(S.year),y1:8,y2:100,stroke:'#fff','stroke-dasharray':'3 3',opacity:.6},el);
  mk('circle',{cx:X(S.year),cy:Y(calc(p,S.sc,S.year).r),r:4,fill:SCN(S.sc).color,stroke:'#fff'},el);
}
// ---------- play ----------
const IC_PLAY='<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg>';
const IC_PAUSE='<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function setPlay(on){$('#play').innerHTML=on?IC_PAUSE:IC_PLAY}
function toggle(){
  if(S.timer){clearInterval(S.timer);S.timer=null;setPlay(false);return}
  if(S.year>=D.model.endYear)S.year=D.model.startYear;
  setPlay(true);

document.querySelectorAll('#viewTabs .tab').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;update(true)});
$('#slider').oninput=e=>{S.year=+e.target.value;update(false)};
$('#play').onclick=toggle;setPlay(false);
// ---------- zoom & pan ----------
const V={x:0,y:0,z:1};
const cl=o=>{o.z=Math.max(1,Math.min(6,o.z));o.x=Math.min(0,Math.max(380*(1-o.z),o.x));o.y=Math.min(0,Math.max(440*(1-o.z),o.y));return o};
const k01=v=>Math.max(0,Math.min(1,v));
function posOf(p,z){const t=k01((z-2)/1.5),mx=p.major?p.px:p.t[0],my=p.major?p.py:p.t[1];return[mx+(p.t[0]-mx)*t,my+(p.t[1]-my)*t]}
function applyZoom(){
  const{x,y,z}=V;
  vp.setAttribute('transform','translate('+x+','+y+') scale('+z+')');
  const fade=k01((z-1.7)/.9),sel=S.view==='pref'?S.sel:null;
  ALL.forEach(p=>{
    if(!p.g)return;
    const q=posOf(p,z),sx=x+z*q[0],sy=y+z*q[1],on=p.id===sel;
    p.g.setAttribute('transform','translate('+sx+','+sy+') scale('+p.s+')');
    p.g.classList.toggle('on',on);
    const o=p.major||on?1:fade;
    p.g.style.opacity=o;p.g.style.pointerEvents=o<.15?'none':'auto';
    p.nm.style.opacity=p.major||on||z>2.8?1:0;
    if(p.major){p.ld.setAttribute('x1',x+z*p.t[0]);p.ld.setAttribute('y1',y+z*p.t[1]);p.ld.setAttribute('x2',sx);p.ld.setAttribute('y2',sy);p.dt.setAttribute('cx',x+z*p.t[0]);p.dt.setAttribute('cy',y+z*p.t[1])}
  });
  map.style.touchAction=z>1.02?'none':'pan-y';
  $('#zl').textContent=Math.round(z*100)+'%';
}
const toVB=(cx,cy)=>{const pt=map.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(map.getScreenCTM().inverse())};
function zoomAt(f,cx,cy){const z2=Math.max(1,Math.min(6,V.z*f)),k=z2/V.z;V.x=cx-(cx-V.x)*k;V.y=cy-(cy-V.y)*k;V.z=z2;cl(V);applyZoom()}
let anim;
function animateTo(t){
  cancelAnimationFrame(anim);cl(t);const f={x:V.x,y:V.y,z:V.z},t0=performance.now();
  const step=n=>{const k=Math.min(1,(n-t0)/450),e=1-Math.pow(1-k,3);
    V.x=f.x+(t.x-f.x)*e;V.y=f.y+(t.y-f.y)*e;V.z=f.z+(t.z-f.z)*e;applyZoom();if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function focusPref(p){
  const zt=p.major?V.z:Math.max(V.z,2.8),q=posOf(p,zt);
  animateTo({x:190-q[0]*zt,y:220-q[1]*zt,z:zt});
}
$('#zin').onclick=()=>zoomAt(1.6,190,220);
$('#zout').onclick=()=>zoomAt(1/1.6,190,220);
$('#zrst').onclick=()=>animateTo({x:0,y:0,z:1});
map.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const q=toVB(e.clientX,e.clientY);zoomAt(Math.exp(-e.deltaY*.0018),q.x,q.y)},{passive:false});
const ptr=new Map();let d0=0,sx0=0,sy0=0,v0={x:0,y:0};
map.addEventListener('pointerdown',e=>{
  cancelAnimationFrame(anim);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1){moved=false;sx0=e.clientX;sy0=e.clientY;v0={x:V.x,y:V.y}}
  if(ptr.size===2){const[a,b]=[...ptr.values()];d0=Math.hypot(a.x-b.x,a.y-b.y);moved=true}
});
window.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===2){
    const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d0>0){const q=toVB((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(d/d0,q.x,q.y)}
    d0=d;
  }else if(ptr.size===1&&V.z>1.02){
    const dx=e.clientX-sx0,dy=e.clientY-sy0;
    if(Math.hypot(dx,dy)>5)moved=true;
    if(moved){const sc=map.getScreenCTM().a;V.x=v0.x+dx/sc;V.y=v0.y+dy/sc;cl(V);applyZoom()}
  }
});
['pointerup','pointercancel'].forEach(n=>window.addEventListener(n,e=>{ptr.delete(e.pointerId);if(ptr.size===1){const r=[...ptr.values()][0];sx0=r.x;sy0=r.y;v0={x:V.x,y:V.y}}}));

// =====================================================
// 管理パネル（編集権限のある本人にだけ表示される）
// =====================================================
const KL={site:'画面の文言',model:'シミュレーション設定',scenarios:'シナリオ',prefectures:'都道府県データ',lessons:'外国の事例セクション',
 title:'タイトル',subtitle:'サブタイトル',tabNat:'タブ名（全体）',tabPref:'タブ名（都道府県）',mapCaption:'地図の下の説明',areaNat:'全体表示の名称',approxSuffix:'都道府県名の後ろ',allChip:'「全国」ボタン',
 ratioLabel:'ラベル：外国人比率',japaneseLabel:'ラベル：日本人',foreignerLabel:'ラベル：外国人',totalLabel:'ラベル：総人口',unitMan:'人口の単位',chartTitle:'グラフの見出し',note:'注記（**太字**）',
 startYear:'開始年',endYear:'終了年',baseRatio:'開始年の全国外国人比率(%)',baseTotal:'開始年の総人口(百万人)',curve:'増加カーブ指数(1=直線)',ringMax:'リング満量(%)',
 id:'ID（変更しない）',name:'名称',ratio2070:'終了年の外国人比率(%)',total2070:'終了年の総人口(百万人)',color:'色',desc:'説明',
 lon:'経度',lat:'緯度',pop:'総人口(百万人)',ratio:'外国人比率(%)',k:'人口減少係数',major:'主要地域（常時リング表示）',px:'ピンX',py:'ピンY',fx:'固定X',fy:'固定Y',
 intro:'導入文',lessonLabel:'「教訓」ラベル',themes:'4つのテーマ',no:'番号/記号',sub:'小見出し',cases:'事例カード',tag:'国・地域',points:'箇条書き',caveat:'注意書き',lesson:'日本への教訓',
 timeline:'年表',events:'出来事',year:'年',place:'国・地域',text:'内容',balance:'見落としてはいけない視点',conclusion:'結論',questionsTitle:'問いの見出し',questions:'問い',sourceNote:'出典の注記'};
let curTab='site';
const setMsg=t=>{$('#adMsg').textContent=t};
let dt;
function changed(){setMsg('未公開の変更あり（この画面にはすぐ反映）');clearTimeout(dt);dt=setTimeout(renderAll,200)}
function det(label,open){const d=document.createElement('details');d.className='d';if(open)d.open=true;const s=document.createElement('summary'),sp=document.createElement('span');sp.textContent=label;s.appendChild(sp);d.appendChild(s);return{d,s}}
function sumOf(it,i){return it.name||it.title||it.tag||(it.year?it.year+' '+(it.place||''):'')||(it.text?String(it.text).slice(0,18):'')||'#'+(i+1)}
function ctl(a,i){
  const w=document.createElement('span');w.className='ct';
  [['▲',()=>{if(i>0){const t=a[i-1];a[i-1]=a[i];a[i]=t;return 1}}],['▼',()=>{if(i<a.length-1){const t=a[i+1];a[i+1]=a[i];a[i]=t;return 1}}],['✕',()=>{a.splice(i,1);return 1}]].forEach(x=>{
    const b=document.createElement('button');b.type='button';b.textContent=x[0];
    b.onclick=e=>{e.preventDefault();e.stopPropagation();if(x[1]()){rebuildEditor();changed()}};w.appendChild(b);
  });
  return w;
}
function arr(parent,o,key,label,open){
  const a=o[key],box=det(label+'（'+a.length+'）',open).d;
  a.forEach((it,i)=>{
    if(it&&typeof it==='object'){
      const x=det(sumOf(it,i));x.s.appendChild(ctl(a,i));
      Object.keys(it).forEach(k=>field(x.d,it,k,KL[k]||k));box.appendChild(x.d);
    }else{
      const row=document.createElement('div');row.className='ar';
      field(row,a,i,'#'+(i+1));row.appendChild(ctl(a,i));box.appendChild(row);
    }
  });
  const add=document.createElement('button');add.type='button';add.className='btn';add.textContent='＋ 追加';
  add.onclick=()=>{
    const last=a[a.length-1];let n;
    if(last&&typeof last==='object'){n=JSON.parse(JSON.stringify(last));if('id' in n)n.id='n'+Math.random().toString(36).slice(2,6)}
    else n=typeof last==='number'?0:'';
    a.push(n);rebuildEditor();changed();
  };
  box.appendChild(add);parent.appendChild(box);
}
function field(parent,o,key,label){
  const v=o[key];
  if(Array.isArray(v))return arr(parent,o,key,label);
  if(v&&typeof v==='object'){const x=det(label,true);Object.keys(v).forEach(k=>field(x.d,v,k,KL[k]||k));parent.appendChild(x.d);return}
  const w=document.createElement('label');w.className='f';
  const sp=document.createElement('span');sp.textContent=label;w.appendChild(sp);
  let el;
  if(typeof v==='boolean'){el=document.createElement('input');el.type='checkbox';el.checked=v;el.onchange=()=>{o[key]=el.checked;changed()}}
  else if(typeof v==='number'){el=document.createElement('input');el.type='number';el.step='any';el.value=v;el.oninput=()=>{o[key]=el.value===''?0:+el.value;changed()}}
  else if(key==='color'){el=document.createElement('input');el.type='color';el.value=/^#[0-9a-f]{6}$/i.test(v)?v:'#a855f7';el.oninput=()=>{o[key]=el.value;changed()}}
  else{
    const s=String(v),long=s.length>34||s.indexOf('\n')>=0;
    el=document.createElement(long?'textarea':'input');if(!long)el.type='text';
    el.value=s;if(long)el.rows=Math.min(9,Math.ceil(s.length/36)+1);
    el.oninput=()=>{o[key]=el.value;changed()};
  }
  w.appendChild(el);parent.appendChild(w);
}
function validate(n){
  ['site','model','scenarios','prefectures','lessons'].forEach(k=>{if(!n[k])throw new Error(k+' がありません')});
  if(!n.scenarios.length||!n.prefectures.length)throw new Error('シナリオ／都道府県が空です');
  if(!(n.model.endYear>n.model.startYear))throw new Error('終了年は開始年より後にしてください');
  n.prefectures.forEach(p=>{if(![p.lon,p.lat,p.pop,p.ratio,p.k].every(Number.isFinite))throw new Error('数値が不正です: '+p.name)});
}
function jsonTab(body){
  const ta=document.createElement('textarea');ta.className='js';ta.value=JSON.stringify(D,null,2);body.appendChild(ta);
  const bar=document.createElement('div');bar.className='bar';
  const mkb=(t,f)=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=t;b.onclick=f;bar.appendChild(b)};
  mkb('JSONを適用',()=>{try{const n=JSON.parse(ta.value);validate(n);D=n;renderAll();setMsg('JSONを適用しました（未公開）')}catch(e){setMsg('JSONエラー: '+e.message)}});
  mkb('ファイルに書き出す',async()=>{try{const d=await claude.use('downloads');if(!d)return setMsg('この環境では書き出せません');await d.save({filename:'site-data.json',data:JSON.stringify(D,null,2)});setMsg('書き出しました')}catch(e){setMsg('書き出しをキャンセル/失敗しました')}});
  const fi=document.createElement('input');fi.type='file';fi.accept='.json,application/json';fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result;setMsg('読み込みました。「JSONを適用」を押してください')};r.readAsText(f)};
  bar.appendChild(fi);body.appendChild(bar);
}
function rebuildEditor(){
  const body=$('#adBody');body.innerHTML='';
  document.querySelectorAll('#adTabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===curTab));
  if(curTab==='json')return jsonTab(body);
  const v=D[curTab];
  if(Array.isArray(v))arr(body,D,curTab,KL[curTab],true);
  else Object.keys(v).forEach(k=>field(body,v,k,KL[k]||k));
}
function buildDoc(){
  const d=new DOMParser().parseFromString(SRC,'text/html');
  [...d.head.children].forEach(n=>{if(!n.matches('meta[charset],meta[name=viewport],title,style#app-css'))n.remove()});
  const keep=['wrap','adm','admBtn','site-data','app'];
  [...d.body.children].forEach(n=>{if(keep.indexOf(n.id)<0)n.remove()});
  [...d.body.attributes].forEach(a=>d.body.removeAttribute(a.name));
  [...d.documentElement.attributes].forEach(a=>{if(a.name!=='lang')d.documentElement.removeAttribute(a.name)});
  d.getElementById('site-data').textContent=JSON.stringify(D,null,1).replace(/</g,'\\u003c');
  d.title=D.site.title;
  return '<!DOCTYPE html>\n'+d.documentElement.outerHTML;
}
async function publishAll(){
  try{
    validate(D);
    const a=await claude.use('artifact');
    if(!a)return setMsg('このビューでは公開できません');
    setMsg('公開中…');
    await a.publish(buildDoc());
    setMsg('公開しました。開いている画面が自動で更新されます');
  }catch(e){
    const m={conflict:'他の更新と競合しました。最新版に切り替わります',not_writer:'編集権限がありません',not_granted:'編集権限がありません',too_large:'データが大きすぎます',rate_limited:'更新が多すぎます。少し待ってください',invalid_content:'ページの生成に失敗しました'};
    setMsg(m[e.code]||('公開に失敗しました: '+(e.message||e.code)));
  }
}
function openAdmin(on){$('#adm').hidden=!on;window.__edit=on;if(on){rebuildEditor();buildLessons()}}
$('#admBtn').onclick=()=>openAdmin(true);
$('#adClose').onclick=()=>openAdmin(false);
$('#adPub').onclick=publishAll;
$('#adRev').onclick=()=>{D=JSON.parse(ORIG);renderAll();rebuildEditor();setMsg('読み込み時の状態に戻しました（未公開）')};
document.querySelectorAll('#adTabs button').forEach(b=>b.onclick=()=>{curTab=b.dataset.k;rebuildEditor()});
(async()=>{
  try{
    if(typeof claude==='undefined'||!claude.use)return;
    const r=await Promise.all([claude.use('user'),claude.use('artifact')]);
    if(!r[0]||!r[1])return;
    if((await r[0].canEdit())||(await r[0].isOwner()))$('#admBtn').hidden=false;
  }catch(e){}
})();
// ---------- start ----------
renderAll();
